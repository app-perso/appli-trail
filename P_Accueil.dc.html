<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil — premium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@500;600;700&amp;family=Manrope:wght@500;700;800&amp;family=Archivo:wdth,wght@100..125,500..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.ink}}; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: -80px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: {{c.glow1}}; filter: blur(60px)"></div>
  <div aria-hidden="true" style="position: absolute; right: -140px; top: 120px; width: 360px; height: 360px; border-radius: 50%; background: {{c.glow2}}; filter: blur(70px)"></div>

  <div style="position: absolute; left: 24px; right: 24px; top: 44px; display: flex; flex-direction: column">
    <span style="font-size: 13px; font-weight: 600; color: {{c.muted}}; margin-bottom: 2px">{{ r.date }}</span>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-family: {{f.fam}}; font-stretch: {{f.st}}; font-size: {{f.num}}px; font-weight: {{f.numW}}; line-height: .95; letter-spacing: {{f.ls}}">{{ r.days }}</span>
      <span style="font-family: {{f.fam}}; font-stretch: {{f.st}}; font-size: 18px; font-weight: 600; color: {{c.muted}}">jours</span>
    </div>
    <span style="margin-top: 8px; font-family: {{f.fam}}; font-stretch: {{f.st}}; font-size: {{f.name}}px; font-weight: {{f.nameW}}; line-height: 1.1; letter-spacing: -.01em">{{ r.name }}</span>
    <div style="margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap">
      <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: {{c.pill}}; display: flex; align-items: center; font-size: 13px; font-weight: 600">{{ r.km }}</span>
      <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: {{c.pill}}; display: flex; align-items: center; font-size: 13px; font-weight: 600">{{ r.dp }}</span>
      <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: linear-gradient(135deg, #FF5F6D, #FFB36B); color: #FFFFFF; display: flex; align-items: center; font-size: 13px; font-weight: 700">{{ r.ke }}</span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 236px; height: 246px; border-radius: 28px; background: {{c.card}}; border: 1px solid {{c.cardLine}}; box-shadow: {{c.shadow}}">
    <span style="position: absolute; left: 20px; top: 16px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: {{c.muted}}">Saison 2027</span>
    <a href="P_Courses.dc.html" style="position: absolute; right: 16px; top: 10px; height: 28px; padding: 0 12px; border-radius: 999px; background: {{c.pill}}; display: flex; align-items: center; font-size: 12px; font-weight: 600; text-decoration: none">Toutes mes courses →</a>
    <div style="position: absolute; left: 8px; top: 50px; width: 342px; height: 190px">
      <svg role="img" aria-label="La saison en profil de trail : départ aujourd'hui, Chianti en mars, Maxi-Race fin mai, arrivée au Val d'Aran en juillet" width="342" height="190" viewBox="0 0 342 190" style="position: absolute; left: 0; top: 0; overflow: visible">
        <defs>
          <linearGradient id="fillOff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{c.off1}}"></stop><stop offset="1" stop-color="{{c.off2}}"></stop></linearGradient>
          <linearGradient id="fillOn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B6B" stop-opacity=".45"></stop><stop offset="1" stop-color="#FFB36B" stop-opacity=".05"></stop></linearGradient>
          <linearGradient id="lineOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB36B"></stop><stop offset="1" stop-color="#FF5F6D"></stop></linearGradient>
          <clipPath id="done"><rect x="0" y="-40" width="{{ selX }}" height="240"></rect></clipPath>
        </defs>
        <line x1="10" y1="56" x2="336" y2="56" stroke="{{c.grid}}" stroke-width="1"></line>
        <line x1="10" y1="106" x2="336" y2="106" stroke="{{c.grid}}" stroke-width="1"></line>
        <line x1="10" y1="156" x2="336" y2="156" stroke="{{c.axis}}" stroke-width="1"></line>
        <path d="{{ fillD }}" fill="url(#fillOff)"></path>
        <path d="{{ fillD }}" fill="url(#fillOn)" clip-path="url(#done)"></path>
        <path d="{{ lineD }}" fill="none" stroke="{{c.lineOff}}" stroke-width="2" stroke-linejoin="round"></path>
        <path d="{{ lineD }}" fill="none" stroke="url(#lineOn)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#done)"></path>
        <line x1="{{ m.chianti.x }}" y1="{{ m.chianti.y2 }}" x2="{{ m.chianti.x }}" y2="156" stroke="{{c.axis}}" stroke-width="1" stroke-dasharray="2 3"></line>
        <line x1="{{ m.maxi.x }}" y1="{{ m.maxi.y2 }}" x2="{{ m.maxi.x }}" y2="156" stroke="{{c.axis}}" stroke-width="1" stroke-dasharray="2 3"></line>
        <line x1="{{ m.aran.x }}" y1="{{ m.aran.y2 }}" x2="{{ m.aran.x }}" y2="156" stroke="{{c.axis}}" stroke-width="1" stroke-dasharray="2 3"></line>
        <circle cx="{{ m.chianti.x }}" cy="{{ m.chianti.y }}" r="{{ m.chianti.r }}" fill="{{ m.chianti.fill }}" stroke="{{ m.chianti.stroke }}" stroke-width="2.5"></circle>
        <circle cx="{{ m.maxi.x }}" cy="{{ m.maxi.y }}" r="{{ m.maxi.r }}" fill="{{ m.maxi.fill }}" stroke="{{ m.maxi.stroke }}" stroke-width="2.5"></circle>
        <circle cx="{{ m.aran.x }}" cy="{{ m.aran.y }}" r="{{ m.aran.r }}" fill="{{ m.aran.fill }}" stroke="{{ m.aran.stroke }}" stroke-width="2.5"></circle>
        <circle cx="{{ start.x }}" cy="{{ start.y }}" r="5" fill="{{c.ink}}"></circle>
        <text x="4" y="174" font-size="10" font-weight="600" fill="{{c.ink}}" font-family="Inter">Auj.</text>
        <text x="44" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">janv.</text>
        <text x="90" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">fév.</text>
        <text x="130" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">mars</text>
        <text x="178" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">avr.</text>
        <text x="222" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">mai</text>
        <text x="266" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">juin</text>
        <text x="310" y="174" font-size="10" fill="{{c.muted}}" font-family="Inter">juil.</text>
      </svg>
      <button onClick="{{ pickChianti }}" aria-pressed="{{ on.chianti }}" aria-label="Chianti by UTMB" style="position: absolute; left: {{ pl.chianti.l }}px; top: {{ pl.chianti.t }}px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid {{ pl.chianti.line }}; background: {{ pl.chianti.bg }}; color: {{ pl.chianti.fg }}; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 12px rgba(40,30,90,0.10)">Chianti</button>
      <button onClick="{{ pickMaxi }}" aria-pressed="{{ on.maxi }}" aria-label="Maxi-Race" style="position: absolute; left: {{ pl.maxi.l }}px; top: {{ pl.maxi.t }}px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid {{ pl.maxi.line }}; background: {{ pl.maxi.bg }}; color: {{ pl.maxi.fg }}; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 12px rgba(40,30,90,0.10)">Maxi-Race</button>
      <button onClick="{{ pickAran }}" aria-pressed="{{ on.aran }}" aria-label="Val d'Aran by UTMB" style="position: absolute; left: {{ pl.aran.l }}px; top: {{ pl.aran.t }}px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid {{ pl.aran.line }}; background: {{ pl.aran.bg }}; color: {{ pl.aran.fg }}; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 12px rgba(40,30,90,0.10)">🏁 Val d'Aran</button>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 494px; height: 124px; box-sizing: border-box; border-radius: 28px; background: {{c.card}}; border: 1px solid {{c.cardLine}}; box-shadow: {{c.shadow}}; padding: 14px 20px; display: flex; align-items: center; gap: 18px">
    <svg role="img" aria-label="Semaine : 42 km sur 60, 1 650 m de D+ sur 2 500, 1 renfo sur 2" width="100" height="100" viewBox="0 0 140 140">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5F6D"></stop><stop offset="1" stop-color="#FFB36B"></stop></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FC8A5"></stop><stop offset="1" stop-color="#8BE8C3"></stop></linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A6BFF"></stop><stop offset="1" stop-color="#C6A8FF"></stop></linearGradient>
      </defs>
      <g transform="rotate(-90 70 70)" fill="none" stroke-width="13" stroke-linecap="round">
        <circle cx="70" cy="70" r="58" stroke="{{c.track}}"></circle>
        <circle cx="70" cy="70" r="58" stroke="url(#g1)" stroke-dasharray="255 365"></circle>
        <circle cx="70" cy="70" r="42" stroke="{{c.track}}"></circle>
        <circle cx="70" cy="70" r="42" stroke="url(#g2)" stroke-dasharray="174 264"></circle>
        <circle cx="70" cy="70" r="26" stroke="{{c.track}}"></circle>
        <circle cx="70" cy="70" r="26" stroke="url(#g3)" stroke-dasharray="82 164"></circle>
      </g>
    </svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: {{c.muted}}">Cette semaine</span>
      <span style="font-size: 15px"><b style="font-weight: 600; color: {{c.coral}}">42</b> <span style="color: {{c.muted}}">/ 60 km</span></span>
      <span style="font-size: 15px"><b style="font-weight: 600; color: {{c.teal}}">1 650</b> <span style="color: {{c.muted}}">/ 2 500 m D+</span></span>
      <span style="font-size: 15px"><b style="font-weight: 600; color: {{c.violet}}">1</b> <span style="color: {{c.muted}}">/ 2 renfo</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 630px; height: 118px; box-sizing: border-box; border-radius: 28px; background: {{c.card}}; border: 1px solid {{c.cardLine}}; box-shadow: {{c.shadow}}; padding: 12px 14px 12px 14px; display: flex; flex-direction: column; gap: 6px">
    <span style="padding-left: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: {{c.muted}}">Aujourd'hui · 2 séances</span>
    <a href="P_Debrief.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; text-decoration: none">
      <span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, #FF5F6D, #FFB36B); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 19 L9 9 L13 15 L16 11 L21 19 Z"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-family: {{f.fam}}; font-stretch: {{f.st}}; font-size: 16px; font-weight: {{f.nameW}}">Sortie vallonnée</span>
        <span style="font-size: 12px; color: {{c.muted}}">1h30 · 15 km · 400 m D+ · 18h</span>
      </span>
      <span style="flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid {{c.lineOff}}"></span>
    </a>
    <a href="P_Debrief.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; text-decoration: none">
      <span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, #7A6BFF, #C6A8FF); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7 V17 M18 7 V17 M3 10 V14 M21 10 V14 M6 12 H18"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-family: {{f.fam}}; font-stretch: {{f.st}}; font-size: 16px; font-weight: {{f.nameW}}">Renfo jambes</span>
        <span style="font-size: 12px; color: {{c.muted}}">35 min · presse, bulgares, step-downs</span>
      </span>
      <span style="flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: {{c.teal}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 17 L19 7"></path></svg>
      </span>
    </a>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 24px; right: 24px; bottom: 22px; height: 62px; border-radius: 999px; background: {{c.nav}}; border: 1px solid {{c.cardLine}}; box-shadow: {{c.shadow}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="P_Accueil.dc.html" aria-label="Objectif" style="justify-self: center; width: 52px; height: 46px; border-radius: 999px; background: {{c.navOn}}; display: flex; align-items: center; justify-content: center; color: {{c.navOnInk}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 19 L9 9 L13 15 L16 11 L21 19 Z"></path></svg></a>
    <a href="P_Checkin.dc.html" aria-label="Check-in" style="justify-self: center; width: 52px; height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.muted}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 h4 l2 -5 l4 10 l2 -5 h6"></path></svg></a>
    <a href="P_Charge.dc.html" aria-label="Charge" style="justify-self: center; width: 52px; height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.muted}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20 V13 M12 20 V6 M19 20 V10"></path></svg></a>
    <a href="P_Parcours.dc.html" aria-label="Parcours" style="justify-self: center; width: 52px; height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.muted}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 L3 6 V20 L9 18 L15 20 L21 18 V4 L15 6 Z M9 4 V18 M15 6 V20"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["jour","nuit"],"default":"jour"},"police":{"editor":"enum","options":["Inter Tight","Manrope","Archivo"],"default":"Archivo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'chianti' }; }
  renderVals() {
    var jour = {
      bg: '#F7F4FA', ink: '#1E1B2E', muted: '#6F6A86',
      glow1: 'rgba(255,190,160,0.55)', glow2: 'rgba(196,182,255,0.45)',
      card: 'rgba(255,255,255,0.85)', cardLine: 'rgba(255,255,255,0.95)', shadow: '0 14px 40px rgba(70,50,140,0.10)',
      pill: 'rgba(255,255,255,0.85)', grid: 'rgba(30,27,46,0.05)', axis: 'rgba(30,27,46,0.22)',
      off1: 'rgba(160,150,210,0.28)', off2: 'rgba(160,150,210,0.02)', lineOff: '#B9B2D8',
      track: 'rgba(30,27,46,0.07)', coral: '#F0565F', teal: '#14A98A', violet: '#6F5EF0',
      nav: 'rgba(255,255,255,0.9)', navOn: '#1E1B2E', navOnInk: '#FFFFFF',
      pillOnBg: '#1E1B2E', pillOnFg: '#FFFFFF', pillOffBg: '#FFFFFF', pillOffFg: '#1E1B2E', pillLine: 'rgba(30,27,46,0.08)', dotOff: '#FFFFFF'
    };
    var nuit = {
      bg: '#0E0C1F', ink: '#F3F0FF', muted: '#A49FC4',
      glow1: 'rgba(255,110,90,0.22)', glow2: 'rgba(120,100,255,0.25)',
      card: 'rgba(255,255,255,0.06)', cardLine: 'rgba(255,255,255,0.10)', shadow: '0 14px 40px rgba(0,0,0,0.35)',
      pill: 'rgba(255,255,255,0.10)', grid: 'rgba(255,255,255,0.05)', axis: 'rgba(255,255,255,0.25)',
      off1: 'rgba(140,125,230,0.30)', off2: 'rgba(140,125,230,0.02)', lineOff: '#6E62B0',
      track: 'rgba(255,255,255,0.08)', coral: '#FF7A6E', teal: '#3FE0B8', violet: '#A996FF',
      nav: 'rgba(30,26,58,0.85)', navOn: '#FFFFFF', navOnInk: '#0E0C1F',
      pillOnBg: '#FFFFFF', pillOnFg: '#0E0C1F', pillOffBg: 'rgba(255,255,255,0.10)', pillOffFg: '#F3F0FF', pillLine: 'rgba(255,255,255,0.14)', dotOff: '#0E0C1F'
    };
    var fonts = {
      'Inter Tight': { fam: "'Inter Tight', sans-serif", st: '100%', num: 86, numW: 600, nameW: 600, name: 26, ls: '-.05em' },
      'Manrope': { fam: "'Manrope', sans-serif", st: '100%', num: 84, numW: 800, nameW: 700, name: 25, ls: '-.05em' },
      'Archivo': { fam: "'Archivo', sans-serif", st: '118%', num: 70, numW: 800, nameW: 700, name: 23, ls: '-.04em' }
    };
    var races = {
      chianti: { days: 103, name: 'Chianti by UTMB', km: '74 km', dp: '3 000 m D+', ke: '104 km-effort', date: '20 mars 2027' },
      maxi: { days: 174, name: 'Maxi-Race · demi-tour du lac', km: '~56 km', dp: '~3 300 m D+', ke: '~89 km-effort', date: '30 mai 2027' },
      aran: { days: 212, name: "Val d'Aran by UTMB", km: '75 km', dp: '5 100 m D+', ke: '126 km-effort', date: '7 juillet 2027' }
    };
    var pos = { chianti: 166, maxi: 272, aran: 328 };
    // Hauteur des sommets proportionnelle au km-effort (km + D+/100) : 1 km-effort = 0,95 px
    var ke = { chianti: 104, maxi: 89, aran: 126 };
    var sig = { chianti: 24, maxi: 18, aran: 26 };
    function raw(x) {
      var y = 150 - (x - 10) * 0.04;
      y -= 5 * Math.sin(x * 0.21) + 3 * Math.sin(x * 0.57 + 1) + 1.6 * Math.sin(x * 1.7);
      return y;
    }
    var amp = { chianti: 0, maxi: 0, aran: 0 };
    function elevNoClamp(x) {
      var y = raw(x);
      for (var k in amp) { y -= amp[k] * Math.exp(-Math.pow((x - pos[k]) / sig[k], 2)); }
      return y;
    }
    for (var it = 0; it < 4; it++) {
      for (var k in amp) { amp[k] += elevNoClamp(pos[k]) - (156 - ke[k] * 0.95); }
    }
    function elev(x) { return Math.min(152, elevNoClamp(x)); }
    var pts = [];
    for (var x = 10; x <= 334; x += 3) { pts.push(x + ' ' + elev(x).toFixed(1)); }
    var lineD = 'M' + pts.join(' L');
    var fillD = lineD + ' L334 156 L10 156 Z';
    var sel = this.state.sel;
    var c = this.props.theme === 'nuit' ? nuit : jour;
    var widths = { chianti: 62, maxi: 76, aran: 96 };
    var m = {}, pl = {}, on = {};
    ['chianti', 'maxi', 'aran'].forEach(function (k) {
      var s = k === sel;
      var px = pos[k], py = elev(px);
      m[k] = { x: px, y: py.toFixed(1), y2: (py + 8).toFixed(1), r: s ? 7 : 5, fill: s ? '#FF5F6D' : c.dotOff, stroke: s ? '#FFFFFF' : c.lineOff };
      var left = Math.min(342 - widths[k], Math.max(0, px - widths[k] / 2));
      pl[k] = { l: left, t: Math.round(py - 40), bg: s ? c.pillOnBg : c.pillOffBg, fg: s ? c.pillOnFg : c.pillOffFg, line: c.pillLine };
      on[k] = s ? 'true' : 'false';
    });
    return {
      c: c,
      f: fonts[this.props.police] || fonts['Archivo'],
      r: races[sel],
      lineD: lineD, fillD: fillD, selX: pos[sel] + 2,
      start: { x: 10, y: elev(10).toFixed(1) },
      m: m, pl: pl, on: on,
      pickChianti: () => this.setState({ sel: 'chianti' }),
      pickMaxi: () => this.setState({ sel: 'maxi' }),
      pickAran: () => this.setState({ sel: 'aran' })
    };
  }
}
</script>
</body>
</html>
